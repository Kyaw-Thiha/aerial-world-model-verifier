[workspace]
name = "aerial-world-model-verifier"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
pandas = "*"
matplotlib = "*"
pyyaml = "*"
six = ">=1.16"
python-dateutil = "<3"
pytest = "*"

[pypi-dependencies]
python-dotenv = ">=1.0"
boto3 = ">=1.34"
modal = "*"

[tasks]
test = "pytest -q"
fetch-tii = "python scripts/fetch_tii.py"
phase0 = "python experiments/phase0_floor.py"
