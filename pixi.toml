[workspace]
name = "aerial-world-model-verifier"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
pandas = "*"
matplotlib = "*"
pyyaml = "*"
six = ">=1.16"
python-dateutil = "<3"
pytest = "*"

[pypi-dependencies]
python-dotenv = ">=1.0"
boto3 = ">=1.34"
modal = "*"

# Track A perception stack. CPU-only on purpose: every real GPU job runs in a
# `remote/` Modal image, so the local env only needs to import and test wrappers.
# See docs/decisions.md [A] 2026-11-08.
[feature.gpu.dependencies]
opencv = "*"
pytorch-cpu = "*"
torchvision = "*"

[environments]
default = { solve-group = "default" }
gpu = { features = ["gpu"], solve-group = "default" }

[tasks]
test = "pytest -q"
fetch-tii = "python scripts/fetch_tii.py"
phase0 = "python experiments/phase0_floor.py"
sync-r2 = "python scripts/sync_r2.py"
