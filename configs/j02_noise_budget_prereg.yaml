version: 1
date: '2026-11-21'
status: preregistered
track: J
owner_branch: track-j-reader
written: >
  With configs/j01_anatomy_prereg.yaml, before any decomposition or floor number was computed.
note: >
  Item 6 of handoff 19. A synthetic noise budget: hold the real paths, replace the depicted
  side by a controlled error with the measured statistics, and measure the minimum detectable
  violation (MDV) of the frozen clip statistic and of the G-round window machinery. The
  point is a numeric target for the reader, not a new detector.

inputs:
  clips: data/processed/track_d/clips  # schema v2, real condition only, 100 clips, 8 flights
  anatomy_parameters: results/j01_anatomy/params.json  # produced by J01, frozen before this runs
  segment_code: src/verdict/segments.py  # G-round machinery, used unchanged

question: >
  Given a reader error with the measured bias, slow/fast split and correlation time, what is
  the smallest tilt violation the clip-level verdict and the window machinery can detect at a
  5 % false-reject, and how does that floor move with the error's parameters and with the
  window length?

construction:
  truth_side: >
    The path side of every real clip is kept unchanged: `lean_req`, `vel_req`, `tilt_req_deg`,
    `t`, `pos`, `yaw`. The depicted side is replaced entirely: a perfect depiction is
    `depicted_lean = lean_req` (a real flight's body lean is the required lean up to the drag
    model already baked into the schema), and the reader error is added on top.
  synthetic_error:
    model: >
      Per flight, e(t) = b_f + s(t) + a(t), with a per-flight bias vector b_f, a slow Gaussian
      component s and a fast one a. Both components are generated by filtering white noise with
      a Gaussian kernel whose width is matched to the requested split (slow: cutoff 0.5 Hz;
      fast: white). The total variance is normalised to the requested sigma, and the realised
      bias/slow/fast shares are reported beside the requested ones, so the generator is checked
      rather than assumed.
    correlation_time: >
      The correlation time is set through a single AR(1)-with-cutoff construction: each
      component is an exponentially correlated Gaussian process with the requested tau, then
      band-limited at 0.5 Hz. The realised tau_int is measured with the J01 estimator and
      printed beside the requested one.
    units: degrees in the lean plane, isotropically oriented unless a variant says otherwise
  violation:
    type: >
      Depicted lean = lean_req - Delta * lhat_req, i.e. a uniform reduction of the required
      tilt by Delta degrees along the required direction (the small-violation limit of the
      tilt-removal edit). Delta in {0, 2, 4, 6, 8, 10, 12, 15, 20, 30} deg.
    also: the full tilt removal (Delta = |lean_req|) and the mirrored roll, as anchors, and
      the yaw control and null edit as controls.
    note: >
      A uniform subtraction is used, not the G-round zeroing, because MDV is a threshold on
      the *size* of a violation and a proportional edit's size depends on the path's own
      excitation. Both are reported for the full-removal anchor.

statistics:
  clip_statistic: median per-frame angle between depicted and required thrust axis (the frozen statistic)
  segment_statistic: >
    the G-round scan statistic on 8-frame windows, hop 4, maximum over windows, persistence 1
    and 2, computed with src/verdict/segments.py unchanged.
  threshold: >
    Empirical 95th percentile of the statistic over the H0 population (Delta = 0), computed
    leave-one-flight-out (fit on 7 flights, score the 8th) so that the threshold is never fit
    on the clip it scores. Reported for the whole-clip median and for each window length
    separately.
  mdv_definition: >
    The smallest Delta at which the detection rate (k/n over 100 clips) reaches 50 %, with the
    rate at each Delta reported so the whole curve is visible. Linear interpolation between
    the two bracketing grid points; marked as interpolated.
  mdv_against_window_length: >
    Window lengths 8, 12, 16, 24 and 48 frames (48 = the whole clip at 12 Hz), hop fixed at
    half the window, same leave-one-flight-out calibration and the same MDV rule. This is the
    "does a shorter window lower the floor" question.
  mdv_against_parameters:
    sigma_deg: [3.0, 4.8, 8.0]      # median experiment: 4.8 = the published trimmed RMSE
    bias_deg: [0.0, 2.0, 5.0]       # 2-5 deg = the G2 quiet-window bias
    tau_int_s: [0.2, 0.5, 1.0, 2.0]
    slow_share: [0.2, 0.5, 0.8]     # of the centred variance
    design: one-factor-at-a-time around the measured centre point, all full factorial where
      the grid is small enough (sigma x bias x tau = 36 cells), reported as a table and as a
      figure of MDV against each parameter.
  analytic_crosscheck: >
    MDV_formula = z*sqrt(se^2 + sigma_b^2) + z*se, se = sigma/sqrt(n_eff), n_eff = window/tau_int,
    z = 1.645. Plotted against the measured MDV for every cell; the report states where the
    formula is optimistic and why (it assumes Gaussian, independent windows and a known
    direction for the violation).
  replicates: >
    200 independent error draws per cell, numpy.random.default_rng(1); detection is averaged
    over draws and clips, so the k/n is over 100*200 draws and the flight-clustered bootstrap
    (5,000, rng(1)) is reported beside the point estimate. 8 flights = descriptive spread.

success_criterion:
  what_counts: >
    A measured MDV curve with its denominators, the analytic cross-check, and the parameter
    sensitivity. A number that reproduces the published floor (14.73 deg drag-free) at the
    measured reader error is the sanity anchor; a large disagreement is reported, not tuned
    away.
  falsification: >
    If the measured floor is at or above the analytic one for every cell, the error is not
    removable by the mechanisms the handoff proposed and the report says so.

cost:
  gpu_usd: 0
  note: CPU only, numpy + the stored clip schema
