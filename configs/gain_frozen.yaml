rule: R1_scalar_g1
statistic: per-clip regression of depicted lean on required lean; l_dep = G1*l_req0
  + G2*(R_yaw v/g) + b
options:
  drag: fitted
  fixed_drag: 0.295
  intercept: true
  lag_search: true
  lag_bounds_ms:
  - -150.0
  - 150.0
  lag_step_ms: 25.0
  estimator: ols
  smoothing_s: 0.0
  confidence_weights: false
  sg_window_s: 0.37
  sg_polyorder: 3
  n_boot: 400
  seed: 20261113
  min_frames: 24
abstention:
  min_frames: 24
  usable_fraction_min: 0.5
  signal_frames:
    required_tilt_deg_min: 10.0
    min_frames: 12
    fraction_min: 0.2
    note: the existing pre-registered excitation rule, carried over unchanged
  excitation:
    statistic: standard deviation of required lean along its principal axis (sqrt
      of the largest eigenvalue of the 2x2 covariance)
    floor_deg: 2.0
    justification: 'With the depicted estimator''s ~4 deg median error and about 8
      independent 0.5 s blocks in a 4 s clip, a regressor spread below 2 deg gives
      a gain standard error above 0.35: a 50 % gain change cannot be resolved, so
      the clip is not testable rather than tested and passed.

      '
  conditioning:
    statistic: condition number of the scalar design matrix including the intercept
    max: 1000
    justification: 'Straight-line acceleration makes the acceleration and velocity
      columns collinear; above 1e3 the coefficient standard error is inflated by more
      than an order of magnitude and the gain is not identified.

      '
  ci_half_width:
    statistic: bootstrap half-width of G1
    max: 0.35
    justification: 'The smallest violation in scope is a 50 % gain change. A per-clip
      interval wider than 0.35 cannot contribute to that decision, so the clip abstains.

      '
  confidence_gate:
    config: configs/gate_frozen.yaml
    application: pair_level
    sensitivity: per_condition
  order:
  - min_frames
  - usable_fraction
  - signal_frames
  - excitation
  - conditioning
  - ci_half_width
  - confidence_gate
gate:
